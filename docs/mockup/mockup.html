<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExpressBites Mockup</title>
<style>
  :root {
    --primary: #E65100;
    --on-primary: #FFFFFF;
    --primary-container: #FFDBCB;
    --on-primary-container: #5A1B00;
    --surface: #FAFAFA;
    --surface-card: #FFFFFF;
    --surface-high: #F5EDE9;
    --outline: #D7C2B8;
    --text: #1F2937;
    --text-muted: #6B7280;
    --success: #2E7D32;
    --error: #BA1A1A;
    --page-bg: #EDE7E3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Roboto, "Segoe UI", system-ui, sans-serif;
    background: var(--page-bg);
    color: var(--text);
    padding: 32px 16px;
  }
  header.pagina { max-width: 1200px; margin: 0 auto 28px; }
  header.pagina h1 { font-size: 28px; }
  header.pagina p { color: var(--text-muted); margin-top: 6px; }
  .grid {
    display: flex; flex-wrap: wrap; gap: 36px 28px;
    justify-content: center; max-width: 1240px; margin: 0 auto;
  }
  figure { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  figcaption { font-weight: 600; font-size: 15px; }
  figcaption span { color: var(--primary); }

  .phone {
    width: 380px; height: 800px; padding: 10px;
    background: #111; border-radius: 44px;
    box-shadow: 0 12px 30px rgba(0,0,0,.18);
  }
  .screen {
    width: 360px; height: 780px; border-radius: 34px; overflow: hidden;
    background: var(--surface); display: flex; flex-direction: column; position: relative;
  }
  .status {
    height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; font-size: 13px; font-weight: 600;
  }
  .status .ic { display: flex; gap: 4px; align-items: center; }
  .status svg { width: 15px; height: 15px; }
  .appbar {
    height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px;
    padding: 0 6px 0 4px; background: var(--surface);
  }
  .appbar h2 { font-size: 21px; font-weight: 500; flex: 1; padding-left: 8px; }
  .iconbtn {
    width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; position: relative;
  }
  .iconbtn svg { width: 24px; height: 24px; }
  .badge {
    position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; border-radius: 8px;
    background: var(--error); color: #fff; font-size: 10px; display: grid; place-items: center; font-weight: 700;
  }
  .body { flex: 1; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; }
  svg { fill: currentColor; }

  .card {
    background: var(--surface-card); border-radius: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  .btn {
    height: 48px; border-radius: 24px; background: var(--primary); color: var(--on-primary);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-weight: 600; font-size: 15px;
  }
  .btn svg { width: 20px; height: 20px; }
  .btn.outline { background: transparent; color: var(--primary); border: 1.5px solid var(--outline); }
  .field {
    height: 56px; border: 1.5px solid var(--outline); border-radius: 6px;
    display: flex; align-items: center; gap: 12px; padding: 0 12px; position: relative; background: var(--surface-card);
  }
  .field svg { width: 22px; height: 22px; color: var(--text-muted); }
  .field label {
    position: absolute; top: -9px; left: 10px; background: var(--surface-card); padding: 0 4px;
    font-size: 12px; color: var(--text-muted);
  }
  .field.focus { border-color: var(--primary); border-width: 2px; }
  .field.focus label { color: var(--primary); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    height: 32px; padding: 0 14px; border: 1px solid var(--outline); border-radius: 8px;
    display: flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; background: var(--surface-card);
  }
  .chip.sel { background: var(--primary-container); border-color: var(--primary-container); color: var(--on-primary-container); }
  .chip svg { width: 16px; height: 16px; }
  .muted { color: var(--text-muted); }
  .small { font-size: 13px; }
  .title { font-size: 17px; font-weight: 600; }
  .price { font-size: 17px; font-weight: 500; }
  .row { display: flex; align-items: center; gap: 12px; }
  .between { justify-content: space-between; }
  .thumb {
    width: 72px; height: 72px; border-radius: 12px; background: var(--surface-high);
    display: grid; place-items: center; color: var(--primary); flex-shrink: 0;
  }
  .thumb svg { width: 34px; height: 34px; }
  .divider { height: 1px; background: #EEE4DF; }
  .tile { display: flex; align-items: center; gap: 16px; padding: 14px 16px; }
  .tile > svg { width: 24px; height: 24px; color: var(--text-muted); flex-shrink: 0; }
  .tile .t { font-size: 15px; }
  .tile .s { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .spacer { flex: 1; }
  .radio, .check { display: flex; align-items: center; gap: 14px; padding: 7px 4px; font-size: 15px; }
  .radio i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--text-muted); display: grid; place-items: center; }
  .radio.on i { border-color: var(--primary); }
  .radio.on i::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
  .check i { width: 18px; height: 18px; border-radius: 3px; border: 2px solid var(--text-muted); display: grid; place-items: center; }
  .check.on i { background: var(--primary); border-color: var(--primary); color: #fff; }
  .check.on i svg { width: 14px; height: 14px; }
  .estado {
    display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: 600;
  }
  .estado.ok { background: #DCEFDC; color: var(--success); }
  .estado.no { background: #FBE1DE; color: var(--error); }
  .estado.prep { background: var(--primary-container); color: var(--on-primary-container); }
  .nav-hint {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 4px; border-radius: 2px; background: #1F2937; opacity: .35;
  }

  body.single { padding: 0; background: #FFFFFF; }
  body.single header.pagina, body.single figcaption { display: none; }
  body.single .grid { display: block; }
  body.single figure { display: none; }
  body.single figure.show { display: block; }
  body.single .phone { box-shadow: none; }
</style>
</head>
<body>
